<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="yellow-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <linearGradient id="yellow-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <filter id="logo-shadow-main" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="0" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g stroke-linejoin="round" stroke-linecap="round">
    <polygon points="6,20 41,50 6,80 36,80 71,50 36,20" fill="url(#yellow-dark)" stroke="url(#yellow-dark)" stroke-width="1" />
    <polygon points="31,20 66,50 31,80 61,80 96,50 61,20" fill="url(#yellow-main)" stroke="url(#yellow-main)" stroke-width="1" filter="url(#logo-shadow-main)" />

    <line x1="36" y1="20" x2="71" y2="50" stroke="#FEF08A" stroke-width="2" opacity="0.8" />
    <line x1="61" y1="20" x2="96" y2="50" stroke="#FEF08A" stroke-width="2" opacity="0.9" />
    <line x1="6" y1="20" x2="41" y2="50" stroke="#FEF08A" stroke-width="2" opacity="0.6" />
  </g>
</svg>
